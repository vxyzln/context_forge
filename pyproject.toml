[project]
name = "context-forge"
version = "0.1.0"
description = "A local-first project intelligence and context generation engine for AI agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_forge"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]