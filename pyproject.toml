[project]
name = "context-forge"
version = "0.1.0"
description = "Deterministic, local-first repository intelligence and agent memory for Python projects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "uvicorn",
]

[project.scripts]
context-forge = "context_forge.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_forge"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: tests requiring external services",]
